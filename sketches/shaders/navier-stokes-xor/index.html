<body>
    <main></main>

    <!-- Info button -->
    <button id="infoBtn" aria-label="Show info" title="Info">i</button>

    <!-- Modal -->
    <div id="infoModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="infoTitle">
        <div class="modal-backdrop" data-close></div>
        <div class="modal-panel">
            <button class="modal-close" aria-label="Close" data-close>&times;</button>

            </p>

    <script src="sketch.js"></script>
    <script>
        (function () {
            const btn = document.getElementById('infoBtn');
            const modal = document.getElementById('infoModal');
            const panel = modal.querySelector('.modal-panel');
            const closeBtn = modal.querySelector('.modal-close');

            // Start closed & inert (no aria-hidden — inert replaces it)
            modal.inert = true;

            let lastFocused = null;

            const open = () => {
                lastFocused = document.activeElement;
                modal.inert = false;            // must be lifted *before* focusing
                modal.classList.add('open');
                closeBtn.focus();
            };

            const close = () => {
                modal.classList.remove('open');
                // Move focus out FIRST, then make the subtree inert.
                if (lastFocused && document.contains(lastFocused)) {
                    lastFocused.focus();
                } else {
                    btn.focus();
                }
                modal.inert = true;
            };

            btn.addEventListener('click', open);

            modal.addEventListener('click', (e) => {
                if (e.target.matches('[data-close]')) close();
            });

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && !modal.inert) close();
            });

            // Minimal focus trap: keep Tab cycling inside the open dialog.
            panel.addEventListener('keydown', (e) => {
                if (e.key !== 'Tab') return;
                const focusables = panel.querySelectorAll(
                    'a[href], button:not([disabled]), [tabindex]:not([tabindex="-1"])'
                );
                if (!focusables.length) return;
                const first = focusables[0];
                const last = focusables[focusables.length - 1];

                if (e.shiftKey && document.activeElement === first) {
                    e.preventDefault(); last.focus();
                } else if (!e.shiftKey && document.activeElement === last) {
                    e.preventDefault(); first.focus();
                }
            });
        })();
    </script>
</body>

</html>
